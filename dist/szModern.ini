; Slave Zero modern renderer (szmodern.dll) settings.
; Edit while the game is closed. Delete a line to get its default.

[Display]
; 0 = borderless fullscreen at the monitor's native resolution, 1 = normal window.
Windowed=0
; Window client size when Windowed=1 (0 = 1920x1080). Ignored in fullscreen.
Width=0
Height=0
; 1 = widescreen with a wider field of view (Hor+), 0 = original 4:3 with side bars.
Widescreen=1
; Widescreen only: move the corner HUD gauges to the screen edges (1) or keep them in the 4:3 area (0).
HudAtEdges=0
; Widescreen only: show the main menu and intro as 4:3 with side bars.
MenusIn4x3=1
; 1 = sync to the display's refresh rate, 0 = uncapped, -1 = follow the game's "Wait For VSync" option.
VSync=1
; Optional frame cap in fps (0 = off). Try 60 if anything in the game feels too fast.
FrameLimit=0

[Quality]
; Multisample anti-aliasing: 1 (off), 2, 4 or 8.
MSAA=4
; Supersampling factor for the 3D scene (1.0 = native, 1.5 / 2.0 = sharper and slower).
RenderScale=1.0
; Anisotropic texture filtering, 1-16.
Anisotropy=16
; Build mipmaps for textures that ship without them (removes distant shimmer).
GenerateMipmaps=1
; Lightmap brightness. 2.0 matches the original Direct3D renderer, 1.0 matches dual-TMU Glide cards.
LightmapScale=2.0
; Treat transparent texels of solid surfaces as holes (fences, grates). 1 = on.
OpaqueCutout=1
; Keep the game's 32-bit textures at full precision (effects, glows). 1 = on.
TrueColor=1
; Load AI-upscaled replacements from szmodern/textures/<name>.png when present. 1 = on.
TexturePack=1
; Per-pixel lighting for textures with normal maps in the pack (<name>_n.png). 1 = on.
NormalMaps=1

[Post]
; Contrast-adaptive sharpening, 0.0 (off) to 1.0.
Sharpen=0.3
; Screen filter: 0 off, 1 scanlines, 2 CRT, 3 CRT curved, 4 retro 640x480 pixels, 5 VHS. F9 cycles in game.
Filter=0
FilterStrength=0.7
; Emulated scanline count for filters 1-3.
Scanlines=480
; Gamma override (0 = use the in-game gamma slider).
Gamma=0

[Overlay]
; Key that opens the in-game settings menu (F1-F12). Back + Start on a gamepad also works.
Key=F10
; Show "F10  Settings" for a few seconds after the game starts.
ShowHint=1
; Pause the game while the menu is open.
PauseGame=1

[Launcher]
; 1 = the launcher starts the game at once without showing its window (run it with --launcher to see it).
StartDirectly=0

[Debug]
; Write szModern.log next to the game.
Log=1
